<div class="page">
  <h2>My Addresses</h2>
  <div class="alert alert-error" *ngIf="error">{{ error }}</div>
  <div class="alert alert-success" *ngIf="message">{{ message }}</div>
  <button class="btn btn-primary" (click)="showForm = true; editingId = ''">Add Address</button>

  <div class="panel" *ngIf="showForm">
    <h3>{{ editingId ? 'Edit' : 'Add' }} Address</h3>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid-2">
        <div class="form-group"><label>Address Line</label><input formControlName="addressLine" /></div>
        <div class="form-group"><label>City</label><input formControlName="city" /></div>
        <div class="form-group"><label>State</label><input formControlName="state" /></div>
        <div class="form-group"><label>Country</label><input formControlName="country" /></div>
        <div class="form-group"><label>Zip Code</label><input formControlName="zipCode" /></div>
        <div class="form-group"><label>Label</label><input formControlName="label" /></div>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <button type="button" class="btn btn-secondary" (click)="resetForm()">Cancel</button>
    </form>
  </div>

  <div class="address-grid">
    <div class="address-card panel" *ngFor="let a of addresses">
      <span class="badge">{{ a.label }}</span>
      <p>{{ a.addressLine }}</p>
      <p>{{ a.city }}, {{ a.state }}, {{ a.country }} - {{ a.zipCode }}</p>
      <button class="btn btn-sm" (click)="edit(a)">Edit</button>
      <button class="btn btn-sm btn-danger" (click)="delete(a.id)">Delete</button>
    </div>
  </div>
</div>
